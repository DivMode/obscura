[package]
name = "obscura-net"
version.workspace = true
edition.workspace = true

[features]
default = []
stealth = ["wreq", "wreq-util"]

[dependencies]
reqwest = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
async-trait = "0.1"
# wreq README notes `prefix-symbols` is Linux/Android only — enabling it on
# macOS arm64 produces linker errors for `build_script_main_*` symbols
# (boring2-sys emits prefixed symbols on Linux/Android but not darwin).
# Keep it unfeatured so macOS builds; openssl-sys conflict isn't a concern
# since obscura-net uses native-tls, not openssl.
wreq = { version = "6.0.0-rc.28", optional = true }
wreq-util = { version = "3.0.0-rc.10", optional = true }
